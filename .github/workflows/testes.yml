name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes do scanner
        run: python -m unittest discover -s tests -v
      - name: Sintaxe do banner de consentimento
        run: node --check skills/blindagem-juridica/templates/cookie-consent/consentimento.js
